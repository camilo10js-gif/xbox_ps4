name: Build xbox_pad

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld git make cmake jq curl

      - name: OpenOrbis
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          echo "OO_PS4_TOOLCHAIN=$PWD/oo" >> $GITHUB_ENV

      - name: SDK GoldHEN
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK sdk
          find sdk -maxdepth 3 | head -80

      - name: Compilar
        run: |
          MAKEFILE_PATH=$(find sdk -type f -name Makefile | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: No se encontró ningún Makefile en el SDK."
            exit 1
          fi
          D=$(dirname "$MAKEFILE_PATH")
          echo "Carpeta del Makefile encontrada: $D"
          cp xbox_pad.cpp "$D"/
          cd "$D"
          ls -la
          export GOLDHEN_SDK=$GITHUB_WORKSPACE/sdk
          export OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/oo
          export PATH="$OO_PS4_TOOLCHAIN/bin:$PATH"
          make OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN

      - name: Recoger resultado
        if: always()
        run: |
          mkdir -p out
          find sdk -name '*.prx' -exec cp {} out/ \;
          ls out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbox_pad
          path: out/
          if-no-files-found: warn
        
