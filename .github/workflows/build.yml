name: Build xbox_pad

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm git make jq curl

      - name: OpenOrbis (release precompilado)
        run: |
          URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | jq -r '.assets[].browser_download_url' | grep -i 'tar.gz' | head -1)
          echo "Descargando: $URL"
          mkdir -p oo
          curl -sL "$URL" -o oo.tar.gz
          tar -xzf oo.tar.gz -C oo
          BINDIR=$(find oo -type d -path '*/bin/linux' | head -1)
          ROOT=$(dirname "$(dirname "$BINDIR")")
          chmod +x "$BINDIR"/* || true
          echo "Toolchain en: $ROOT"
          ls "$ROOT"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$ROOT" >> $GITHUB_ENV

      - name: SDK GoldHEN
        run: git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK sdk

      - name: Compilar
        run: |
          cp xbox_pad.cpp sdk/source/
          cd sdk
          make clean crt
          make TARGET=xbox_pad.prx xbox_pad.prx

      - name: Recoger resultado
        if: always()
        run: |
          mkdir -p out
          find sdk -name '*.prx' -exec cp {} out/ \;
          ls out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbox_pad
          path: out/
          if-no-files-found: warn
