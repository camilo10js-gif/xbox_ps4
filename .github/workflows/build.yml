name: Build XboxPad plugin and configurator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm g++ make git curl python3
      - name: Pinned toolchain
        run: bash scripts/setup.sh "$RUNNER_TEMP/xbox-toolchain"
      - name: Configure environment
        run: |
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/xbox-toolchain/oo/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/xbox-toolchain/sdk" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/xbox-toolchain/compat/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Tests
        run: bash scripts/test.sh
      - name: Build and validate PRX and PKG
        run: |
          bash scripts/build.sh
          python3 scripts/check_exports.py build/sdk/build/source.oelf
      - uses: actions/upload-artifact@v4
        with:
          name: XboxPad-2.11-Configurator-1.0
          if-no-files-found: error
          path: |
            build/sdk/xbox_pad.prx
            build/*.pkg
            build/SHA256SUMS
